<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1a1405" />
      <stop offset="60%" stop-color="#0a0701" />
      <stop offset="100%" stop-color="#020200" />
    </radialGradient>

    <!-- Gold Foil Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="25%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <!-- Outer Ring Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" fill="none" />

  <!-- 8-Pointed Islamic Star (Rub el Hizb) Background Halo -->
  <g transform="translate(256, 256) scale(0.9)" opacity="0.35" filter="url(#goldGlow)">
    <rect x="-140" y="-140" width="280" height="280" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <rect x="-140" y="-140" width="280" height="280" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" transform="rotate(45)" />
  </g>

  <!-- Radiant Gold Circular Frame -->
  <circle cx="256" cy="256" r="190" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.5" />
  <circle cx="256" cy="256" r="176" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />

  <!-- Sacred Quran Book / Reel Motif -->
  <g transform="translate(256, 260)" filter="url(#goldGlow)">
    <!-- Book Stand (Rihal) Base -->
    <path d="M-90,110 L-40,75 L0,105 L40,75 L90,110 L70,125 L0,120 L-70,125 Z" fill="url(#goldGrad)" opacity="0.75" />

    <!-- Left Open Page -->
    <path d="M-10,50 C-45,35 -95,30 -125,45 C-130,10 -115,-40 -10,-45 Z" fill="url(#goldGrad)" />
    <!-- Right Open Page -->
    <path d="M10,50 C45,35 95,30 125,45 C130,10 115,-40 10,-45 Z" fill="url(#goldGrad)" />

    <!-- Page Highlights / Inner Gold Leaves -->
    <path d="M-12,40 C-45,28 -88,24 -115,36 C-118,5 -104,-30 -12,-38 Z" fill="#fffbe8" opacity="0.9" />
    <path d="M12,40 C45,28 88,24 115,36 C118,5 104,-30 12,-38 Z" fill="#fffbe8" opacity="0.9" />

    <!-- Quran Text Lines (Calligraphic Lines) -->
    <line x1="-95" y1="-15" x2="-30" y2="-20" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-90" y1="5" x2="-25" y2="0" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-80" y1="22" x2="-25" y2="18" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <line x1="30" y1="-20" x2="95" y2="-15" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="25" y1="0" x2="90" y2="5" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="25" y1="18" x2="80" y2="22" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Book Spine Ribbon / Centerpiece -->
    <path d="M-4,-48 L4,-48 L4,58 L-4,58 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="68" r="6" fill="url(#goldGrad)" />
  </g>

  <!-- Glowing Crescent & 8-Pointed Star Crown at Top -->
  <g transform="translate(256, 140)" filter="url(#goldGlow)">
    <!-- Crescent Moon -->
    <path d="M-22,-18 C-34,2 -24,28 4,32 C-10,26 -14,10 -6,-10 C-3,-16 0,-18 2,-20 C-8,-22 -16,-20 -22,-18 Z" fill="url(#goldGrad)" />
    <!-- 8-Point Star in Crescent -->
    <g transform="translate(14, -8) scale(0.6)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#fffbe8" />
    </g>
  </g>

  <!-- Islamic Reels Creator Bottom Ribbon / Dot Accents -->
  <circle cx="160" cy="430" r="4" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="256" cy="430" r="5" fill="#fffbe8" opacity="0.9" />
  <circle cx="352" cy="430" r="4" fill="url(#goldGrad)" opacity="0.8" />
</svg>